name: Probe sync secret

# Temporary: checks whether the NEXT_PUBLIC_SYNC_URL secret (a public
# build-time URL) is visible to this repo's workflows. Delete after use.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret presence
        env:
          HAS_SYNC_URL: ${{ secrets.NEXT_PUBLIC_SYNC_URL != '' }}
          HAS_SUPABASE: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' }}
        run: |
          echo "NEXT_PUBLIC_SYNC_URL present:     $HAS_SYNC_URL"
          echo "NEXT_PUBLIC_SUPABASE_URL present: $HAS_SUPABASE"
